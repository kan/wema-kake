version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # server と、テストで使う client は、同じ版で出る。食い違わないように、1 つの PR でまとめて上げる
      mcp-sdk:
        patterns:
          - "@modelcontextprotocol/*"
  # template の wema-kake を、出したばかりの版に上げる PR を作る（kan/lily の template と同じ設計）。
  # template は利用者が写して使う雛形なので、上げ忘れると古い wema-kake で始まる。
  # この PR は ci.yml の automerge-template のジョブが、CI が通ったらマージする。
  - package-ecosystem: "npm"
    directory: "/template"
    schedule:
      interval: "daily"
    # 範囲も動かす。`^0.1.6` は `0.2.0` を受けないので、lock だけ上げると minor を上げたときに古いまま残る
    versioning-strategy: increase
    # version update は既定で公開から 3 日待つ。wema-kake は自分で出した版なので待たない
    cooldown:
      exclude:
        - "@kanf/wema-kake"
    # version update は wema-kake だけ。`allow` で絞ると security update まで止まるので、ほかは
    # `update-types` 付きの `ignore` で止める（`update-types` だけの ignore は security update を除外しない）。
    # template に依存を足したら、ここにも足す
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "wrangler"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # tagpr.yml が呼ぶ kan/tagpr-scripts の共通の workflow の SHA は、
      # scripts/tagpr/ の subtree と揃える。subtree pull と同じ PR でだけ上げ、
      # Dependabot には上げさせない（tagpr-scripts の README「The tagpr workflow」）。
      # 今はタグが無いので上げに来ないが、タグを打つと SHA だけ上げる PR が来る。
      - dependency-name: "kan/tagpr-scripts*"
