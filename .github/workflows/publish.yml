name: Publish

# タグを npm へ stage し、GitHub Release を作る。中身は kan/tagpr-scripts の共通の workflow
# （動きと入力は scripts/tagpr/README.md の「The npm publish workflow」）。
# stage した版は、メンテナが `npm stage approve <stage ID>` するまで公開されない（AGENTS.md の「リリース」）
#
# **このファイルの名前を変えない。** npmjs.com の Trusted Publisher に、この名前で登録してある
# （照合されるのは呼ぶ側のこのファイルの名前）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 1 つのタグに 1 run。止めない（stage の途中で止めると、npm には stage したのに Release が無い版が残る）
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    # SHA は scripts/tagpr/ に取り込んだ commit と同じにする（ci.yml の verify-subtree.mjs が確かめる）
    uses: kan/tagpr-scripts/.github/workflows/publish-npm.yml@3fb536bb107b6b08940ee49f0a8d5a69e68df211
    permissions:
      contents: write  # checkout と GitHub Release
      id-token: write  # npm の Trusted Publishing
    with:
      check: npm run lint && npm test
      # 雛形（template/）から作った利用側が、この tgz だけで通るか（ci.yml の template と同じ確かめ方）。
      # リリース PR のマージは main の CI を待たずに publish まで進むので、ここでも見る。
      # tgz は prepack（npm run build）で作られる
      check-tarball: |
        mkdir -p "$RUNNER_TEMP/template-check"
        cd "$RUNNER_TEMP/template-check"
        npx --yes --package="$TARBALL" wema-kake init site --yes --no-install
        cd site
        npm install "$TARBALL"
        npm run typecheck
        npx wrangler deploy --dry-run
      access: public
