name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

      # 雛形（template/）から作った利用側が、パッケージ（npm pack の出力）だけで通るか。
      # 確かめ方は AGENTS.md の「パッケージの構成」と同じ。npm pack の prepack が npm run build を
      # 回すので、ビルドの確認もここで兼ねる
      - name: template
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          tgz="$(ls "$RUNNER_TEMP"/kanf-wema-kake-*.tgz)"
          npx --yes --package="$tgz" wema-kake init site --yes --no-install
          cd site
          npm install "$tgz"
          npm run typecheck
          npx wrangler deploy --dry-run
