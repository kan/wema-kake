name: tagpr-label

# **リリース PR のラベル（`tagpr:minor` など）を付け外ししたら、リリース PR を作り直す。**
# 中身は kan/tagpr-scripts の共通の workflow。動きは tagpr-scripts の README の「The tagpr workflow」。
# 作り直しは `tagpr.yml` を `workflow_dispatch` で起動して行うので、`tagpr.yml` の名前と
# `workflow_dispatch:` を変えない。
on:
  pull_request_target:
    types: [labeled, unlabeled]

permissions: {}

jobs:
  rebuild:
    # **SHA は `tagpr.yml` の呼ぶ行と同じ、`scripts/tagpr/` に取り込んだ tagpr-scripts の commit にする**
    # （AGENTS.md「リリース PR（tagpr）の仕組み」。CI の verify-subtree.mjs が照合する）
    uses: kan/tagpr-scripts/.github/workflows/tagpr-label.yml@231fe768bce55eb24fed1e10a4b27907ebf7a306
    permissions:
      actions: write        # tagpr.yml を起動する
      pull-requests: write  # リリース PR を draft にする
